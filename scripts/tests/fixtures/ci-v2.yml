name: CI v2 fixture

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets --all-features --locked
      - name: Rust doctests
        run: cargo test --workspace --all-features --doc --locked

  docs-and-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONPYCACHEPREFIX: ${{ runner.temp }}/uca-python-cache
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Install Python 3.13.5
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: 3.13.5
      - name: Run exact-inventory checker shards
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/uca-checker-evidence"
          test ! -e "$evidence"
          python3 scripts/run_checker_shards.py --jobs 4 --timeout-seconds 1800 --inventory scripts/checker_test_inventory.json --evidence-dir "$evidence" --require-clean --require-runner-image-identity
      - name: Check repository contracts
        run: python3 scripts/check_repo_contracts.py
      - name: Upload checker evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: checker-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/uca-checker-evidence
          if-no-files-found: error
          retention-days: 14
