name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets --all-features
      - name: Browser Chat behavior
        run: UCA_SOURCE_COMMIT=$GITHUB_SHA cargo build --locked -p ustc-agentd --bin ustc-agentd && node scripts/test_agent_chat_browser.mjs target/debug/ustc-agentd
      - name: Doc tests
        run: cargo test --locked --all-features --doc
      - name: Compose MVP delivery
        run: bash scripts/check_mvp_compose_delivery.sh

  windows-launchers:
    name: windows-powershell-51
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify Windows PowerShell 5.1 launchers
        shell: cmd
        run: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/check_windows_launchers.ps1

  contracts:
    name: docs-and-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONPYCACHEPREFIX: /tmp/uca-python-cache-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Install Python 3.13.5
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: 3.13.5
      - name: Run exact-inventory checker shards
        run: python3 scripts/run_checker_shards.py --jobs 4 --timeout-seconds 1800 --inventory scripts/checker_test_inventory.json --evidence-dir "$RUNNER_TEMP/uca-checker-evidence" --require-clean --require-runner-image-identity
      - name: Repository contract checks
        run: python3 scripts/check_repo_contracts.py
      - name: Upload checker evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: checker-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/uca-checker-evidence
          if-no-files-found: error
          retention-days: 14
