name: final-main-submission-artifacts

'on':
  push:
    branches: [artifact/sep5-final-main-r3]

permissions:
  contents: read

concurrency:
  group: usable-enhancement-candidate-${{ github.sha }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TARGET_SHA: a26c55b1c5d2ec094a492505deee1a983466586d
      UCA_SOURCE_COMMIT: a26c55b1c5d2ec094a492505deee1a983466586d
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      PYTHONPYCACHEPREFIX: /tmp/uca-enhancement-pycache-${{ github.run_id }}-${{ github.run_attempt }}
      CHROME_BIN: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact product source
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain=v1)"
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: 3.13.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Governance and unit tests
        run: |
          set -euo pipefail
          python3 scripts/run_checker_shards.py --jobs 4 --timeout-seconds 1800 --inventory scripts/checker_test_inventory.json --evidence-dir "$RUNNER_TEMP/checker-evidence" --require-clean --require-runner-image-identity
          python3 scripts/check_repo_contracts.py
          node --test scripts/tests/test_course_editor.mjs scripts/tests/test_affairs_checklist.mjs
          python3 -B -W error::ResourceWarning -m unittest discover -s examples/sso-interface -p 'test_*.py' -v
      - name: Rust complete gates
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features
          cargo test --locked --all-features --doc
          cargo build --release --locked -p ustc-agentd --bin ustc-agentd
      - name: Exact compiled browser journeys
        env:
          UCA_TEST_SCREENSHOT: ${{ runner.temp }}/usable-course-editor.png
        run: |
          set -euo pipefail
          test -x "$CHROME_BIN"
          node --version
          node scripts/test_agent_chat_browser.mjs target/release/ustc-agentd
          node scripts/test_usable_enhancements_browser.mjs target/release/ustc-agentd
      - name: Deterministic Compose gate and archive readback
        run: |
          set -euo pipefail
          bash scripts/check_mvp_compose_delivery.sh
          out="$RUNNER_TEMP/usable-candidate"
          bash scripts/package_three_plugin_mvp_compose.sh --binary target/release/ustc-agentd --output-dir "$out" --source-commit "$TARGET_SHA"
          short=${TARGET_SHA:0:12}
          (cd "$out" && sha256sum -c "ustc-campus-agent-mvp-compose-${short}.sha256")
          mkdir -p "$RUNNER_TEMP/readback-tar" "$RUNNER_TEMP/readback-zip"
          tar -xzf "$out/ustc-campus-agent-mvp-compose-${short}.tar.gz" -C "$RUNNER_TEMP/readback-tar"
          unzip -q "$out/ustc-campus-agent-mvp-compose-${short}.zip" -d "$RUNNER_TEMP/readback-zip"
          diff -qr "$RUNNER_TEMP/readback-tar/ustc-campus-agent-mvp-compose" "$RUNNER_TEMP/readback-zip/ustc-campus-agent-mvp-compose"
          for root in "$RUNNER_TEMP/readback-tar" "$RUNNER_TEMP/readback-zip"; do
            package="$root/ustc-campus-agent-mvp-compose"
            (cd "$package" && sha256sum -c SHA256SUMS)
            chmod u+x "$package/bin/ustc-agentd"
            test "$("$package/bin/ustc-agentd" source-commit)" = "$TARGET_SHA"
          done
          cp "$RUNNER_TEMP/usable-course-editor.png" "$out/"
          cp docs/contracts/usable-demo-enhancements.md "$out/ENHANCEMENT-CONTRACT.md"
          printf 'builder_commit=%s\nsource_commit=%s\narchive_pair_readback=PASS\n' "$GITHUB_SHA" "$TARGET_SHA" > "$out/source-identity.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: usable-enhancement-candidate-${{ env.TARGET_SHA }}
          path: ${{ runner.temp }}/usable-candidate/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: checker-evidence-${{ env.TARGET_SHA }}
          path: ${{ runner.temp }}/checker-evidence/
          if-no-files-found: warn
          retention-days: 14

  windows-launchers:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a26c55b1c5d2ec094a492505deee1a983466586d
          persist-credentials: false
      - name: Verify Windows PowerShell 5.1 launchers
        shell: cmd
        run: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/check_windows_launchers.ps1

  android-build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TARGET_SHA: a26c55b1c5d2ec094a492505deee1a983466586d
    steps:
      - name: Checkout exact frozen source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify source identity
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain=v1)"
      - name: Install Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5
        with:
          toolchain: 1.97.1
      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "emulator" \
            "system-images;android-35;google_apis;x86_64"
      - name: Build exact Rust server
        run: UCA_SOURCE_COMMIT="$TARGET_SHA" cargo build --locked -p ustc-agentd --bin ustc-agentd
      - name: Build, lint and verify debug APK
        run: bash scripts/build_android_demo.sh --source-commit "$TARGET_SHA" --output-dir "$RUNNER_TEMP/android-artifact"
      - name: Run emulator and WebView journey
        run: |
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm -a -w /dev/kvm
          apk="$RUNNER_TEMP/android-artifact/ustc-campus-agent-android-debug-${TARGET_SHA}.apk"
          bash scripts/smoke_android_demo_emulator.sh \
            --apk "$apk" \
            --server-binary target/debug/ustc-agentd \
            --evidence-dir "$RUNNER_TEMP/android-artifact" \
            --api-level 35
      - name: Record builder/source identities
        if: ${{ always() }}
        run: |
          mkdir -p "$RUNNER_TEMP/android-artifact"
          printf 'builder_commit=%s\nsource_commit=%s\n' "$GITHUB_SHA" "$TARGET_SHA" \
            > "$RUNNER_TEMP/android-artifact/source-identity.txt"
      - name: Upload exact Android artifact and evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ustc-campus-agent-android-${{ env.TARGET_SHA }}
          path: ${{ runner.temp }}/android-artifact
          if-no-files-found: error
          retention-days: 14
