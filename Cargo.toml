[workspace]
members = [
  "apps/ustc-agentd",
  "apps/ustc-agent",
  "apps/ustc-agentctl",
  "crates/platform-core",
  "crates/agent-runtime",
  "crates/agent-tool-protocol",
  "crates/adapters",
  "crates/course-planning",
  "crates/affairs-navigator",
  "crates/client-core",
  "crates/client-protocol",
  "crates/application-ingress",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
authors = ["USTC Campus Agent contributors"]
license = "UNLICENSED"
repository = "https://github.com/Develata/ustc-campus-agent"
homepage = "https://github.com/Develata/ustc-campus-agent"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
semver = "1.0.27"
sha2 = "0.10.9"
hmac = "0.12.1"
base64 = "0.22.1"
ustc-agent-tool-protocol = { path = "crates/agent-tool-protocol" }
time = { version = "0.3.54", features = ["parsing"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
