[workspace]
members = [
  "apps/ustc-agentd",
  "apps/ustc-agentctl",
  "crates/platform-core",
  "crates/adapters",
  "crates/course-planning",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
authors = ["USTC Campus Agent contributors"]
license = "UNLICENSED"
repository = "https://github.com/Develata/ustc-campus-agent"
homepage = "https://github.com/Develata/ustc-campus-agent"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
time = { version = "0.3.54", features = ["parsing"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
