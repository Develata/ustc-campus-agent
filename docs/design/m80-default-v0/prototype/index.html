<!--
  M80 Default v0 — Clickable Prototype (Deliverable 16B)
  Classification: External disposable executable prototype · Deliverable 16B only ·
  Non-product · Non-retained M80 frontend · No backend/API · No readiness evidence.
  Illustrative / No live backend — 全部数据为设计样例，无真实后端、无真实安装、无真实授权。
  Status: Proposal · Source: 2f4de29032560ff3e13d9994b33a3aff14243f44
  本文件为设计演示物，不是 retained frontend skeleton；不包含任何 API/route/DTO 声明。
  所有"服务器确认（演示）"转场在真实系统中对应 server typed result/event。
  Screens: 16 screen/state IDs（13 main S01–S13 + 3 failure-branch S06a/S07a/S11a），hash 导航；

<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USTC Campus Agent — 设计原型（Illustrative / No live backend）</title>
<style>
:root{
  --canvas:#FAF9F7; --surface:#FFFFFF; --subtle:#F2F0EC;
  --ink:#1C1B1A; --muted:#5B5750; --divider:#E3E0DA;
  --accent:#2E5A66; --danger:#8C3B33; --warning:#7A5C1E; --success:#3C6B4F;
}
*{box-sizing:border-box}
body{margin:0;background:var(--canvas);color:var(--ink);
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;
  line-height:1.65;font-size:15px}
.shell{max-width:760px;margin:0 auto;padding:0 20px 96px}
.banner{background:var(--subtle);border-bottom:1px solid var(--divider);
  padding:8px 20px;font-size:13px;color:var(--muted);text-align:center}
header.top{display:flex;justify-content:space-between;align-items:baseline;
  padding:28px 0 12px;border-bottom:1px solid var(--divider);margin-bottom:20px;gap:12px;flex-wrap:wrap}
h1{font-size:22px;margin:0;font-weight:600}
h2{font-size:16px;margin:28px 0 8px;font-weight:600}
.scrid{font-size:12px;color:var(--muted);font-family:ui-monospace,monospace}
.rows{border-top:1px solid var(--divider)}
.row{display:flex;justify-content:space-between;align-items:center;gap:16px;
  padding:14px 4px;border-bottom:1px solid var(--divider)}
.row .meta{font-size:13px;color:var(--muted)}
.attn{border-left:3px solid var(--warning);padding-left:12px}
button,.btn{font:inherit;font-size:14px;padding:8px 18px;border-radius:6px;
  border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;
  text-decoration:none;display:inline-flex;align-items:center;justify-content:center;
  min-height:44px;min-width:44px}
button.sec,.btn.sec{background:transparent;color:var(--accent)}
button.danger{background:var(--danger);border-color:var(--danger)}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
input[type=checkbox]{width:24px;height:24px;vertical-align:middle;flex:none}
.note{font-size:13px;color:var(--muted);margin:10px 0}
.warn{background:#FBF6EC;border:1px solid var(--divider);border-left:3px solid var(--warning);
  padding:12px 14px;margin:14px 0;font-size:14px}
.ok{background:#F1F6F2;border-left:3px solid var(--success);padding:12px 14px;margin:14px 0}
ul.clean{list-style:none;padding:0;margin:8px 0}
ul.clean li{padding:10px 4px;border-bottom:1px solid var(--divider)}
label.ck{display:block;min-height:44px;padding:10px 4px;border-bottom:1px solid var(--divider);cursor:pointer}
label.ck .meta{font-size:13px;color:var(--muted);margin-left:24px}
.actions{display:flex;gap:12px;justify-content:flex-end;margin-top:24px;flex-wrap:wrap}
.step{font-size:13px;color:var(--muted);text-align:right}
.demo{margin-top:28px;padding-top:12px;border-top:1px dashed var(--divider);font-size:13px;color:var(--muted)}
.demo a{color:var(--accent)}
footer{margin-top:40px;padding-top:12px;border-top:1px solid var(--divider);
  font-size:12px;color:var(--muted);text-align:center}
nav.idx{font-size:13px;margin:8px 0}
nav.idx a{color:var(--accent);margin-right:8px;white-space:nowrap}
</style>
</head>

<div class="banner">Illustrative / No live backend — 设计原型 · 全部数据与转场为演示 · Status: Proposal</div>
